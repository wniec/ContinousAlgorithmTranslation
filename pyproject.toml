[project]
name = "continousalgorithmtranslation"
version = "0.1.0"
description = "Learned translation of internal state between metaheuristic optimizers (PSO, CMA-ES) on COCO-BBOB"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ioh>=0.3.0",
    "pypop7>=0.0.82,<0.0.83",
    "numpy>=1.20.0,<2.0",
    "torch>=2.0.0",
    "tqdm>=4.67.1,<5",
    "rich>=15.0.0",
    "gymnasium>=0.29",
    "wandb>=0.27.2",
    "python-dotenv>=1.2.2",
    "pflacco>=1.0.0",
    "pandas>=2.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cat"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that use real IOH/pypop7 (slower)",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.5",
]
